# fly.toml – cấu hình deploy MoodTok lên Fly.io
app = "moodtok-app"
primary_region = "sin"  # Singapore – gần Việt Nam nhất

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # không ngủ
  auto_start_machines = true
  min_machines_running = 1     # luôn có ít nhất 1 máy chạy

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume để lưu dữ liệu JSON
[[mounts]]
  source = "moodtok_data"
  destination = "/app/data"
